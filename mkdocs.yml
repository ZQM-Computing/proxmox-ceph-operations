site_name: "Proxmox VE & Ceph Operations"
site_description: Proxmox VE and Ceph operations material — cluster health checks, backup discipline, OSD replacement, VM templates, and upgrade checklists.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/proxmox-ceph-operations

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Design notes: design-notes.md
